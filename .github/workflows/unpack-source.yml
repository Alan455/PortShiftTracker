name: Unpack PortShiftTracker source

on:
  push:
    paths:
      - '.unpack-source-trigger'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/portshift-src"
          cat ci/chunks/*.b64 | base64 -d > "$RUNNER_TEMP/PortShiftTracker_v0.7.zip"
          unzip -t "$RUNNER_TEMP/PortShiftTracker_v0.7.zip"
          unzip -q "$RUNNER_TEMP/PortShiftTracker_v0.7.zip" -d "$RUNNER_TEMP/portshift-src"

      - name: Copy source into repository
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/portshift-src/PortShiftTracker_v0.7/." .
          git status --short

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md settings.gradle.kts build.gradle.kts gradle.properties bootstrap-wrapper.ps1 fix-v0.6-build.ps1 app
          if git diff --cached --quiet; then
            echo "Source already unpacked; nothing to commit."
            exit 0
          fi
          git commit -m "Unpack PortShiftTracker v0.7 source"
          git push origin HEAD:main
