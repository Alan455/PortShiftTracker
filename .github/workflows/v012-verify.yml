name: Verify v0.12 implementation

on:
  push:
    paths:
      - '.v012-trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests and debug builds
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Create temporary signing key
        shell: bash
        run: |
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/test-release.jks"             -storepass testpass123             -keypass testpass123             -alias portshift-test             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=PortShift Test,O=Test,C=IT"
          echo "PST_KEYSTORE_FILE=$RUNNER_TEMP/test-release.jks" >> "$GITHUB_ENV"

      - name: Signed release APK and AAB
        env:
          PST_KEYSTORE_PASSWORD: testpass123
          PST_KEY_ALIAS: portshift-test
          PST_KEY_PASSWORD: testpass123
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify release signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation and Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Print generated Room schema
        shell: bash
        run: |
          find app/schemas -type f -maxdepth 4 -print || true
          cat app/schemas/it.alantamanti.portshifttracker.data.local.AppDatabase/7.json || true

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortShiftTracker-v0.12.0-verification
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/schemas
          if-no-files-found: error
