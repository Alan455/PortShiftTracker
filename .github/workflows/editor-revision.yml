name: Apply editor revision and verify

on:
  push:
    paths:
      - '.editor-revision-trigger'

permissions:
  contents: write

jobs:
  revise-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply editor revision
        run: python3 tools/apply_editor_revision.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and capture Home + Editor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n it.alantamanti.portshifttracker/.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshots/home.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml screenshots/window.xml >/dev/null
            python3 - <<'PY' > /tmp/tap.txt
            import re, xml.etree.ElementTree as ET
            root = ET.parse('screenshots/window.xml').getroot()
            for node in root.iter('node'):
                text = node.attrib.get('text', '')
                if 'Aggiungi prestazione' in text:
                    m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2 = map(int,m.groups())
                        print((x1+x2)//2, (y1+y2)//2)
                        break
            PY
            read X Y < /tmp/tap.txt
            adb shell input tap "$X" "$Y"
            sleep 3
            adb exec-out screencap -p > screenshots/editor.png

      - name: Commit verified v0.7.2 revision
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/it/alantamanti/portshifttracker/ui/PortShiftApp.kt app/build.gradle.kts
          git commit -m "Improve quick shift entry UI for v0.7.2"
          git push

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PortShiftTracker-v0.7.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PortShiftTracker-v0.7.2-ui-preview
          path: screenshots/*.png
          if-no-files-found: error
