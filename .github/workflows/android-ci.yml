name: Android CI + UI screenshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recreate project from source archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/portshift"
          base64 -d ci/PortShiftTracker_v0.7.zip.b64 > "$RUNNER_TEMP/PortShiftTracker_v0.7.zip"
          unzip -q "$RUNNER_TEMP/PortShiftTracker_v0.7.zip" -d "$RUNNER_TEMP/portshift"
          echo "PROJECT_DIR=$RUNNER_TEMP/portshift/PortShiftTracker_v0.7" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PortShiftTracker-v0.7-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p "$PROJECT_DIR/screenshots"
            adb install -r "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am start -W -n it.alantamanti.portshifttracker/.MainActivity
            sleep 5
            adb exec-out screencap -p > "$PROJECT_DIR/screenshots/home.png"
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml "$PROJECT_DIR/screenshots/window.xml" || true

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PortShiftTracker-v0.7-ui-preview
          path: ${{ env.PROJECT_DIR }}/screenshots
          if-no-files-found: warn
