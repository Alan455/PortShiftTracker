name: Android signed release

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Pubblica anche una GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        shell: bash
        env:
          PST_KEYSTORE_BASE64: ${{ secrets.PST_KEYSTORE_BASE64 }}
        run: |
          test -n "$PST_KEYSTORE_BASE64" || { echo "Missing PST_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$PST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/portshift-release.jks"
          echo "PST_KEYSTORE_FILE=$RUNNER_TEMP/portshift-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          PST_KEYSTORE_PASSWORD: ${{ secrets.PST_KEYSTORE_PASSWORD }}
          PST_KEY_ALIAS: ${{ secrets.PST_KEY_ALIAS }}
          PST_KEY_PASSWORD: ${{ secrets.PST_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: PortShiftTracker-v0.12.0-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      - name: Create GitHub release
        if: ${{ inputs.publish_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.12.0"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --title "PortShiftTracker $TAG" \
            --notes-file CHANGELOG.md
