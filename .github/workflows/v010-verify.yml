name: Verify v0.10 feature update

on:
  push:
    paths:
      - '.v010-trigger'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android API 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Apply v0.10 patch
        run: python3 tools/apply_v010_features.py

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main app/src/test
          git commit -m 'Implement faster shift entry and half-turn rules'
          git push

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PortShiftTracker-v0.10.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
